<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniPilot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Hide "Made in Bolt" badge and related elements */
      [class*="bolt-badge"],
      [id*="bolt-badge"],
      div:has(> a[href*="bolt.new"]),
      a[href*="bolt.new"],
      div:has(> a[href*="stackblitz"]),
      a[href*="stackblitz"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
    <script>
      // Remove any injected "Made in Bolt" badge from DOM
      const removeBadge = () => {
        document.querySelectorAll('a[href*="bolt.new"], a[href*="stackblitz"]').forEach((link) => {
          const container = link.closest('div[style*="fixed"]') || link.parentElement || link;
          container.remove();
        });
      };
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', removeBadge);
      } else {
        removeBadge();
      }
      new MutationObserver(removeBadge).observe(document.documentElement, {
        childList: true,
        subtree: true,
      });
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased font-sans selection:bg-blue-100 selection:text-blue-800">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
